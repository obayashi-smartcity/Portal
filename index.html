<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+JP:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TOKENS  ―  Light
   ========================================================== */
:root{
    --primary:#2C55D4;
    --primary-light:#4E76F5;
    --primary-soft:#7C97F7;
    --success:#12A150;
    --bg:#F3F5FB;
    --bg-2:#FBFCFF;
    --card:rgba(255,255,255,.75);
    --card-hover:rgba(255,255,255,.95);
    --text:#0C1428;
    --text-dim:#2A3550;
    --muted:#68748C;
    --border:rgba(15,23,42,.09);
    --border-soft:rgba(15,23,42,.05);
    --chip:rgba(15,23,42,.035);
    --hairline:rgba(15,23,42,.08);
    --glow1:rgba(53,99,233,.14);
    --glow2:rgba(100,136,255,.10);
    --glow3:rgba(18,161,80,.07);
    --sheen:rgba(255,255,255,.9);
    --shadow:0 34px 80px -34px rgba(30,50,110,.35);
}

*{ margin:0; padding:0; box-sizing:border-box; }

::selection{ background:var(--primary); color:#fff; }

html{ scroll-behavior:smooth; }

body{
    font-family:"Inter","Noto Sans JP","Segoe UI","Hiragino Sans","Meiryo",sans-serif;
    font-weight:400;
    color:var(--text);
    line-height:1.65;
    min-height:100vh;
    letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    position:relative;
    overflow-x:hidden;
    background:var(--bg);
    transition:background .6s ease, color .5s ease;
}

/* ---------- ambient gradient field (soft, layered) ---------- */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(1100px 620px at 12% -12%, var(--glow1), transparent 58%),
        radial-gradient(980px 560px at 96% -4%, var(--glow2), transparent 55%),
        radial-gradient(1200px 900px at 78% 116%, var(--glow3), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
    transition:background .6s ease;
}
/* faint grid to add "line" structure without noise */
body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:
        linear-gradient(to right, var(--border-soft) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-soft) 1px, transparent 1px);
    background-size:80px 80px;
    -webkit-mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 75%);
    opacity:.5;
}

.container{
    max-width:1320px;
    margin:0 auto;
    padding:112px 40px 80px;
}

/* ==========================================================
   HEADER
   ========================================================== */
.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:32px;
    padding-bottom:44px;
    margin-bottom:40px;
    border-bottom:1px solid var(--hairline);
    position:relative;
}
/* thin accent line riding on the hairline */
.header::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-1px;
    width:120px;
    height:2px;
    border-radius:2px;
    background:linear-gradient(90deg,var(--primary),var(--primary-soft),transparent);
}
.brand{
    display:flex;
    align-items:center;
    gap:22px;
}
/* ---------- Obayashi Logo ---------- */
.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    padding-right:22px;
    border-right:1px solid var(--hairline);
}
.logo img{
    height:46px;
    width:auto;
    display:block;
}

.title h1{
    font-size:clamp(30px, 4.4vw, 52px);
    font-weight:200;
    letter-spacing:.14em;
    line-height:1.05;
    color:var(--text);
}
.title p{
    color:var(--muted);
    font-size:12px;
    font-weight:500;
    letter-spacing:.32em;
    text-transform:uppercase;
    margin-top:12px;
}
.summary{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}
.badge{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    background:var(--card);
    padding:11px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    font-weight:500;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:9px;
    transition:background .4s, border-color .3s;
}
.badge .dot{
    width:6px;
    height:6px;
    border-radius:50%;
}
.badge.primary{ color:var(--primary-soft); }
.badge.primary .dot{
    background:var(--primary-light);
    box-shadow:0 0 0 4px rgba(100,136,255,.14);
}
.badge.active{ color:var(--success); }
.badge.active .dot{
    background:var(--success);
    box-shadow:0 0 0 4px rgba(52,211,153,.16);
    animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{
    0%,100%{ box-shadow:0 0 0 3px rgba(52,211,153,.16); }
    50%{ box-shadow:0 0 0 6px rgba(52,211,153,.05); }
}
/* ==========================================================
   CATEGORY TABS
   ========================================================== */
.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    width:fit-content;
    max-width:100%;
    padding:6px;
    margin-bottom:44px;
    background:var(--card);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:999px;
}
.tab{
    appearance:none;
    border:0;
    background:transparent;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:.16em;
    color:var(--muted);
    padding:11px 20px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:9px;
    transition:color .25s, background .25s, box-shadow .25s;
}
.tab:hover{ color:var(--text); background:var(--chip); }
.tab .count{
    min-width:22px;
    padding:2px 7px;
    border-radius:999px;
    background:var(--chip);
    color:var(--muted);
    font-size:10.5px;
    font-weight:500;
    letter-spacing:.04em;
    text-align:center;
    transition:background .25s, color .25s;
}
.tab.is-active{
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    box-shadow:0 10px 24px -10px rgba(53,99,233,.6);
}
.tab.is-active .count{ background:rgba(255,255,255,.22); color:#fff; }
.tab:focus-visible{ outline:2px solid var(--primary-light); outline-offset:2px; }

.empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--muted);
    padding:72px 0;
    font-size:14px;
    letter-spacing:.06em;
}

/* ==========================================================
   GRID
   ========================================================== */
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:28px;
}

/* ==========================================================
   CARD
   ========================================================== */
.card{
    position:relative;
    background:var(--card);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-radius:26px;
    border:1px solid var(--border);
    padding:34px 32px 30px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    isolation:isolate;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease, background .4s ease, border-color .4s ease;
    animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:none; }
}
/* soft radial sheen bleeding from top-right (curve) */
.card::after{
    content:"";
    position:absolute;
    z-index:-1;
    top:-40%;
    right:-30%;
    width:75%;
    height:75%;
    border-radius:50%;
    background:radial-gradient(circle, var(--sheen), transparent 70%);
    opacity:.6;
    transition:opacity .5s ease, transform .6s ease;
}
/* crisp top hairline accent (straight line) */
.card::before{
    content:"";
    position:absolute;
    top:0; left:32px; right:32px;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--primary-light),transparent);
    opacity:.5;
    transition:opacity .4s ease, left .5s ease, right .5s ease;
}
.card:hover{
    transform:translateY(-8px);
    background:var(--card-hover);
    border-color:rgba(100,136,255,.35);
    box-shadow:var(--shadow);
}
.card:hover::after{
    opacity:1;
    transform:scale(1.15) translate(-6%,6%);
}
.card:hover::before{
    opacity:1;
    left:0; right:0;
}
.card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
}
.product-name{
    font-size:21px;
    font-weight:600;
    letter-spacing:.005em;
    line-height:1.35;
}
.version{
    background:transparent;
    color:var(--primary-soft);
    padding:5px 13px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    white-space:nowrap;
    border:1px solid rgba(100,136,255,.4);
}
.category{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--chip);
    color:var(--muted);
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    padding:6px 13px;
    border-radius:999px;
    margin-bottom:20px;
    width:fit-content;
    border:1px solid var(--border-soft);
}
.desc{
    color:var(--text-dim);
    font-size:14.5px;
    font-weight:300;
    line-height:1.75;
    margin-bottom:30px;
    flex:1;
}
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:500;
    font-size:14px;
    letter-spacing:.04em;
    color:#fff;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,var(--primary),var(--primary-light) 70%,var(--primary-soft));
    box-shadow:0 14px 30px -12px rgba(53,99,233,.6);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
}
/* moving sheen across button */
.btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.28) 50%,transparent 80%);
    transform:translateX(-120%);
    transition:transform .7s ease;
}
.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 38px -12px rgba(53,99,233,.75);
}
.btn:hover::before{ transform:translateX(120%); }
.btn .arrow{
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    font-size:16px;
}
.btn:hover .arrow{ transform:translateX(6px); }

/* ==========================================================
   ARCHIVE
   ========================================================== */
.archive{
    border-top:1px solid var(--hairline);
    margin-top:28px;
    padding-top:22px;
}
.archive h4{
    font-size:10px;
    color:var(--muted);
    margin-bottom:14px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.22em;
}
.archive-links{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}
.archive-links a{
    text-decoration:none;
    color:var(--muted);
    background:var(--chip);
    border:1px solid var(--border-soft);
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:400;
    letter-spacing:.02em;
    transition:color .25s, border-color .25s, background .25s, transform .25s;
}
.archive-links a:hover{
    border-color:var(--primary-light);
    color:var(--primary-soft);
    background:rgba(53,99,233,.1);
    transform:translateY(-2px);
}

/* ==========================================================
   FOOTER
   ========================================================== */
.footer{
    margin-top:96px;
    padding-top:36px;
    border-top:1px solid var(--hairline);
    text-align:center;
    color:var(--muted);
    font-size:11px;
    font-weight:400;
    letter-spacing:.28em;
    text-transform:uppercase;
}

/* ==========================================================
   RESPONSIVE
   ========================================================== */
@media (max-width:640px){
    .container{ padding:64px 22px 56px; }
    .header{ margin-bottom:28px; align-items:flex-start; }
    .tabs{ border-radius:20px; margin-bottom:32px; }
    .tab{ padding:10px 14px; letter-spacing:.12em; }
    .logo{ padding-right:16px; }
    .logo img{ height:38px; }
    .brand{ gap:16px; }
    .product-grid{ grid-template-columns:1fr; }
}
</style>

/* ---------- タブ定義 ---------- */
const TABS = ["ALL", "DROP", "SHOP", "DASHBOARD", "ADMIN"];
const tabsOf = p => [].concat(p.tab || []).map(t => String(t).toUpperCase());
const inTab = (p, tab) => tab === "ALL" || tabsOf(p).includes(tab);

/* ---------- カード ---------- */
function cardHTML(p){
    const archiveLinks = p.archives
        .map(a => `<a href="${a.url}">${a.ver}</a>`)
        .join("");
    return `
        <div class="card">
            <div class="card-header">
                <div class="product-name">${p.name}</div>
                <div class="version">${p.latest}</div>
            </div>
            <span class="category">${p.category}</span>
            <p class="desc">${p.desc}</p>
            <a class="btn" href="${p.latestUrl}">
                最新版を開く <span class="arrow">→</span>
            </a>
            <div class="archive">
                <h4>過去バージョン</h4>
                <div class="archive-links">${archiveLinks}</div>
            </div>
        </div>
    `;
}

/* ---------- 描画 ---------- */
const grid = document.getElementById("grid");
const tabBar = document.getElementById("tabs");

tabBar.innerHTML = TABS.map(tab => `
    <button class="tab" role="tab" data-tab="${tab}">
        ${tab}<span class="count">${products.filter(p => inTab(p, tab)).length}</span>
    </button>
`).join("");

function render(tab){
    const list = products.filter(p => inTab(p, tab));
    grid.innerHTML = list.length
        ? list.map(cardHTML).join("")
        : `<p class="empty">このカテゴリのプロダクトはまだありません</p>`;
    tabBar.querySelectorAll(".tab").forEach(b => {
        const on = b.dataset.tab === tab;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-selected", on);
    });
}

tabBar.addEventListener("click", e => {
    const b = e.target.closest(".tab");
    if(!b) return;
    const tab = b.dataset.tab;
    // URL の # にタブを残す（例: .../Portal/#drop）→ リンク共有・再読込でも同じタブ
    history.replaceState(null, "", tab === "ALL" ? location.pathname + location.search : "#" + tab.toLowerCase());
    render(tab);
});

const initialTab = location.hash.slice(1).toUpperCase();
render(TABS.includes(initialTab) ? initialTab : "ALL");

/* ---------- サマリー ---------- */
document.getElementById("count-badge").innerHTML =
    `<span class="dot"></span>${products.length} PRODUCTS`;

document.getElementById("active-badge").innerHTML =
    `<span class="dot"></span>${products.length} ACTIVE`;
